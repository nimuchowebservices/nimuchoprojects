{% extends 'main/base.html' %}
{% block title %}Our Services{% endblock %}
{% block content %}
<div class="container py-5">
    <h1 class="text-center mb-5">Our Digital Services</h1>
    <div class="row g-4">
        {% for service in services %}
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <i class="fas {{ service.icon|default:'fa-cogs' }} fa-2x text-primary mb-3"></i>
                    <h5 class="card-title">{{ service.name }}</h5>
                    <p class="card-text">{{ service.description }}</p>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center">No services added yet. Please check back soon.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
